[project]
name = "flycam-tools"
version = "0.1.0"
description = "FlyCam offline tools: synthetic sessions, export, pose refinement, simulator, prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
